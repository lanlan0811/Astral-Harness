[package]
name = "astral"
version = "0.0.1-beta"
description = "Astral — a desktop coding agent built on the AgentScope TypeScript SDK."
authors = ["Astral"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "astral_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true