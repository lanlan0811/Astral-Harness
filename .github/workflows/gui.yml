name: GUI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gui-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 22, not 24: the official Node 24 binaries require macOS 13.5+, which would drop
  # macOS 13.0-13.4. The sidecar ships whatever this pins.
  NODE_VERSION_FILE: .nvmrc

jobs:
  test:
    name: Tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  smoke:
    name: End-to-end smoke
    # The only thing that exercises AgentScope end to end without a real model: a fake
    # OpenAI-compatible endpoint, a real Agent, a real permission round-trip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace sidecar
      - run: npm run smoke --workspace sidecar

  build:
    name: Build ${{ matrix.target }}
    needs: [test, smoke]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Fetch the Node sidecar binary
        shell: bash
        run: bash scripts/fetch-node.sh "${{ matrix.target }}"

      # `beforeBuildCommand` builds the webview bundle and the sidecar for us.
      #
      # continue-on-error so the reporting step below always runs. Reading a job log
      # through the API needs admin rights, so annotations are the only channel out.
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          status=0
          npm run tauri build -- --target ${{ matrix.target }} 2>&1 | tee build.log || status=$?
          exit "$status"

      # Deliberately a separate step: GitHub caps annotations per *step*, and the build
      # step's allowance is consumed by its own log. This one gets a fresh budget, which is
      # why the actual `error[E....]` lines were missing before.
      #
      # rustc and the Tauri bundler both colourise their output, so a real error line starts
      # with an escape sequence and never matches `^error`. The log is stripped once into
      # build.clean.log and every match runs against that. The ESC byte is written with $'...'
      # because BSD sed on the macOS runners has no `\x` escape — using one there produced an
      # empty `s///` expression, and GitHub silently drops empty annotations.
      - name: Report build errors
        if: always()
        shell: bash
        run: |
          escape() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          report() {
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error::$(escape "$line")"
            done
          }

          # `error:` covers the rustc codes and `Error ` covers the bundler's capitalised
          # wording; `thread ... panicked` covers a panic inside the build itself.
          errors='^(error(\[E[0-9]+\])?[,:]?|Error |thread .* panicked)'

          found=0
          if [ -f build.log ]; then
            sed $'s/\033\\[[0-9;]*m//g' build.log > build.clean.log

            grep -aE "$errors" build.clean.log | head -6 | report
            grep -aE '^ *--> src/' build.clean.log | head -4 | report
            if grep -qaE "$errors" build.clean.log; then found=1; fi
          fi

          # Always report what the bundle directory actually holds, so "the bundler failed"
          # and "the artifacts landed somewhere else" are distinguishable.
          {
            echo "--- bundle output ---"
            find src-tauri/target -maxdepth 4 -name 'bundle' -o -maxdepth 5 \( -name '*.dmg' -o -name '*.exe' -o -name '*.msi' -o -name '*.app' \) 2>/dev/null | head -5
            echo "(end)"
          } | report

          [ "$found" -eq 1 ] && exit 1
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: astral-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app
          if-no-files-found: error
          retention-days: 7