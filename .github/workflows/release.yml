name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION_FILE: .nvmrc

jobs:
  # Release notes live in the repository, not in the workflow — one file per tag, in both
  # languages. Checking before anything is built means a tag pushed without notes stops in
  # seconds rather than after two desktop builds.
  #
  # `shell: bash` is explicit because the default on windows-latest is PowerShell, where
  # this POSIX test is a parse error rather than a missing-file error.
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the release notes exist
        shell: bash
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.en.md"
          if [ ! -f "$notes" ]; then
            echo "::error::Missing $notes. Write the release notes before tagging."
            exit 1
          fi
          echo "Release notes: $notes"

  build:
    name: ${{ matrix.label }}
    needs: [notes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            # --bundles keeps each leg to its own installers. Without it the bundler also
            # builds NSIS on the macOS runner (NSIS is not gated to Windows in
            # tauri-bundler), so a release would carry a second, macOS-built Windows
            # installer alongside the real one.
            args: '--target x86_64-pc-windows-msvc --bundles nsis,msi'
            node-targets: 'x86_64-pc-windows-msvc'
            rust-target: 'x86_64-pc-windows-msvc'
          - os: macos-14
            label: macOS universal
            args: '--target universal-apple-darwin --bundles app,dmg'
            # Space-separated: `rustup target add` takes a list, and a comma makes it
            # reject the whole thing as an unknown target name.
            node-targets: 'aarch64-apple-darwin x86_64-apple-darwin'
            rust-target: 'aarch64-apple-darwin x86_64-apple-darwin'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ${{ env.NODE_VERSION_FILE }}
          cache: npm

      - name: Install Rust targets
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.rust-target }}

      - run: npm ci

      # One binary per architecture; Tauri lipo's them into a universal sidecar.
      - name: Fetch the Node sidecar binaries
        shell: bash
        run: |
          set -euo pipefail
          for target in ${{ matrix.node-targets }}; do
            bash scripts/fetch-node.sh "$target"
          done

      # Tauri resolves `externalBin` by appending the target triple to the name, and for
      # this build cargo reports TARGET=universal-apple-darwin. Neither per-arch binary
      # satisfies that, and tauri-build's copy step fails outright on a missing source, so
      # the universal sidecar has to be assembled here under that exact name.
      - name: Assemble the universal Node sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          lipo -create \
            src-tauri/binaries/node-aarch64-apple-darwin \
            src-tauri/binaries/node-x86_64-apple-darwin \
            -output src-tauri/binaries/node-universal-apple-darwin
          src-tauri/binaries/node-universal-apple-darwin --version

      # Node 22 is the last line that still runs on macOS 13.0, so pin the deployment
      # target rather than inheriting whatever the runner image defaults to.
      #
      # continue-on-error so the reporting step below always runs, and `shell: bash` so the
      # tee and the exit status behave the same on both legs. Reading a job log through the
      # API needs admin rights, so annotations are the only channel out.
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          status=0
          npm run tauri build -- ${{ matrix.args }} 2>&1 | tee build.log || status=$?
          exit "$status"
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'

      # Mirrors the reporting step in gui.yml. rustc and the bundler colourise their
      # output, so a real error line starts with an escape sequence and never matches
      # `^error`; the log is stripped once and matched against that. The ESC byte is
      # written with $'...' because BSD sed on the macOS runners has no `\x` escape.
      - name: Report build errors
        if: always()
        shell: bash
        run: |
          escape() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          report() {
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              echo "::error::$(escape "$line")"
            done
          }
          errors='^(error(\[E[0-9]+\])?[,:]?|Error |thread .* panicked)'

          found=0
          if [ -f build.log ]; then
            sed $'s/\033\\[[0-9;]*m//g' build.log > build.clean.log

            # `|| true` is load-bearing: grep exits 1 when it matches nothing, and this
            # script runs under -e -o pipefail.
            grep -aE "$errors" build.clean.log | head -6 | report || true
            grep -aE '^ *--> src/' build.clean.log | head -4 | report || true
            if grep -qaE "$errors" build.clean.log; then found=1; fi

            # What the bundler actually produced. A missing format is otherwise
            # indistinguishable from a bad glob, and the release notes promise an .msi.
            {
              echo "--- installers produced ---"
              find src-tauri/target -path '*release/bundle*' \
                \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) 2>/dev/null | sort
              echo "--- bundler log ---"
              grep -aiE 'wix|msi|nsis|bundl' build.clean.log | head -8
              echo "(end)"
            } | report || true
          fi

          [ "$found" -eq 1 ] && exit 1
          exit 0

      - name: Collect installers
        uses: actions/upload-artifact@v4
        with:
          name: astral-${{ matrix.os }}-installers
          path: |
            src-tauri/target/*/release/bundle/nsis/*.exe
            src-tauri/target/*/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # One release holding both platforms. Each matrix leg only ever sees the installers from
  # its own runner, so publishing from inside a leg could never attach the other platform's
  # files — the macOS dmg was uploaded as an artifact and then dropped. This job downloads
  # every leg's artifact and attaches them all to a single release.
  #
  # Merged into one directory, so the globs below have to be recursive: upload-artifact
  # preserves the tree under the common ancestor of the matched files, so what arrives is
  # installers/nsis/*.exe and not installers/*.exe. Merging is safe now that each leg is
  # pinned to its own --bundles — no two platforms emit the same filename.
  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: astral-*-installers
          path: installers
          merge-multiple: true

      # Unsigned on purpose for the beta: macOS users clear Gatekeeper once, and Windows
      # SmartScreen warns. The notes spell out the workaround. Wiring real signing is a
      # follow-up, not a half-finished step here.
      # What actually came down, so a build that produced the wrong files and a glob that
      # looks in the wrong place are distinguishable without opening the job log.
      - name: List the downloaded installers
        shell: bash
        run: |
          escape() { printf '%s' "$1" | sed -e 's/%/%25/g' -e 's/\r/%0D/g'; }
          find installers -type f | sort | while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error::$(escape "$line")"
          done

      - uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/${{ github.ref_name }}.en.md
          files: |
            installers/**/*.exe
            installers/**/*.msi
            installers/**/*.dmg
          fail_on_unmatched_files: true